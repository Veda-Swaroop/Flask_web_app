{% extends "layout.html" %}

{% block body %}


    <div class="container my-4 d-flex align-items-center justify-content-between">
        <h1 class="display-5">Books to buy</h1>
        <form action="{{ url_for('main.orders') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-primary" type="submit"> Buy Books </button>
        </form>
        
    </div>


    <div class="container text-center my-4">
        <table class="table table-bordered">
            <thead>
                <tr class="table-primary">
                    <th scope="col"> S.No </th>
                    <th scope="col">Title</th>
                    <th scope="col">Author</th>
                    <th scope="col">Quantity</th>
                </tr>
            </thead>
            <tbody class="table-group-divider">
                {% for item in items %}
                <tr class="table-info">
                    <td> {{ loop.index }} </td>
                    <td> {{ item.book.title }} </td>
                    <td> {{ item.book.authors }} </td>
                    <td> {{ item.quantity }} </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>




      




  




{% endblock %}
