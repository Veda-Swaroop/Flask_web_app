{% extends "layout.html" %}

{% block body %}

    <div class="card text-center mb-3" style="width: 20rem;">
        <div class="card-body">
            <h5 class="card-title">Let's verify your account</h5>

            <form action="{{ url_for('auth.verify') }}" method="post">

                <div class="mb-3">
                    <input type="text" class="form-control" autocomplete="off" autofocus placeholder="Enter username" name="username" required>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} fade show mt-3" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
        </div>

    </div>


{% endblock %}
