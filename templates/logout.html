{% extends "layout.html" %}

{% block body %}

    <div class="card text-center mb-3" style="width: 20rem;">
        <div class="card-body">

            <div>
                <h5 class="card-title">Logout</h5> 
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} fade show mt-3" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <a class="btn btn-primary text-light" href="{{ url_for('login') }}">Login</a>
            </div>

        </div>
    </div>

    
   
{% endblock %}
